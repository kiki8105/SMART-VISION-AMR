# Physical Waffle Pi only. TurtleBot3's stock wheel/IMU odom is remapped to
# /wheel/odom_raw with its TF disabled by hardware_robot_ekf.launch.py on Pi.
# The PC joint integrator provides /wheel/odom with nonzero covariance.
# Fuse wheel forward speed and the differential-drive zero lateral speed;
# fuse ONLY bias-corrected IMU yaw rate. Never fuse wheel yaw/yaw-rate here.
# AMCL continues to own map->odom, limiting map-frame drift. This local
# odom-frame EKF cannot remove unbounded dead-reckoning drift by itself.
ekf_hardware:
  ros__parameters:
    frequency: 20.0
    sensor_timeout: 0.35
    two_d_mode: true
    publish_tf: true
    reset_on_time_jump: true
    print_diagnostics: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    odom0: /wheel/odom
    odom0_config: [false, false, false, false, false, false,
                   true, true, false, false, false, false,
                   false, false, false]
    odom0_queue_size: 20
    odom0_twist_rejection_threshold: 5.0
    imu0: /imu/ekf
    imu0_config: [false, false, false, false, false, false,
                  false, false, false, false, false, true,
                  false, false, false]
    imu0_queue_size: 30
    imu0_twist_rejection_threshold: 5.0
    imu0_remove_gravitational_acceleration: false

# Physical dimensions can be calibrated independently of the vendor's odom.
# Variances use squared SI units. Do not copy simulation benchmark errors here.
wheel_joint_odometry:
  ros__parameters:
    wheel_radius: 0.033
    wheel_separation: 0.287
    max_wheel_speed: 12.0
    reject_stale_stamps: true
    max_stamp_age_sec: 1.0
    future_stamp_tolerance_sec: 0.25
    pose_xy_variance: 0.0025
    pose_yaw_variance: 0.0064
    forward_velocity_variance: 0.0004
    lateral_velocity_variance: 0.000025
    yaw_rate_variance: 0.0064

imu_ekf_conditioner:
  ros__parameters:
    calibration_seconds: 2.0
    calibration_samples: 25
    wheel_timeout: 0.4
    stationary_linear_limit: 0.01
    stationary_angular_limit: 0.04
    stationary_gyro_limit: 0.12
    minimum_gyro_z_variance: 0.0004
    max_gyro_rate: 3.0
    bias_adaptation: 0.005
    max_stamp_age_sec: 1.0
    future_stamp_tolerance_sec: 0.25

ekf_sensor_guard:
  ros__parameters:
    arm_seconds: 2.0
    stale_seconds: 1.0
    base_frame: base_footprint
    # 0 disables magnitude limits on unobservable local absolute pose.
    # AMCL covariance and independent scan/map agreement guard global pose.
    max_position_variance: 0.0
    max_yaw_variance: 0.0
    max_linear_velocity_variance: 0.25
    max_angular_velocity_variance: 1.0
