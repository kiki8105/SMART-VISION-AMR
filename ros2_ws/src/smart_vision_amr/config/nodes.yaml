/astar_planner:
  ros__parameters:
    map_topic: /map
    map_frame: map
    base_frame: base_footprint
    occupied_threshold: 65
    obstacle_inflation_cells: 6
    # Local prefix repair preserves the goal and the original forward route suffix.
    local_detour_enabled: true
    local_detour_trigger_distance: 1.5
    local_detour_max_rejoin_distance: 2.5
    local_detour_max_length: 4.0
    local_detour_max_lateral_distance: 0.9
    local_detour_clearance_margin: 0.02
    local_detour_observation_margin: 0.05  # m; local planning reserve for scan/grid quantization.
    local_detour_occlusion_extension: 0.5
    local_detour_rejoin_buffer: 0.15
    local_detour_max_expansions: 1500
    local_detour_max_planning_time: 0.06
    local_detour_max_candidates: 10
    local_detour_max_attempts: 3
    # Round corners only if every segment remains clear of inflated/unknown cells.
    path_smoothing_enabled: true
    path_smoothing_iterations: 2
    path_smoothing_shortcut_distance: 0.80  # m; larger values anticipate wider corners.
    path_resample_spacing: 0.05  # m between tracking poses at most.
    # Temporary failed-approach memory; never writes cells into the saved/SLAM map.
    failure_memory_enabled: true
    obstacle_hold_enabled: true
    obstacle_retry_limit: 3  # failed published approaches/execution; a no-path retry is not a new attempt.
    obstacle_clear_duration: 2.0  # s of positive fresh free-ray evidence before automatic resume.
    failure_memory_ttl: 120.0  # s; same bad approach becomes eligible after expiry.
    failure_memory_radius: 0.25  # m around a failed route segment.
    failure_memory_heading_tolerance: 1.0471975511965976  # rad (60 deg); reverse remains legal.
    failure_memory_max_entries: 64
    failure_memory_penalty: 2.0  # nonnegative A* step cost around the restricted approach.
    failure_event_max_age: 3.0  # s; reject stale/replayed execution reports.
    rejoin_progress_distance: 0.35  # m; map+independent odom must confirm actual progress.
    rejoin_cross_track_tolerance: 0.20  # m from the replacement route.
    recovery_turn_heading_threshold: 0.65  # rad; larger first turn needs full sweep clearance.
    recovery_turn_clearance_margin: 0.03  # m beyond robot_radius, without relaxing occupancy.
/path_follower:
  ros__parameters:
    # Detect attempted movement without progress; sensor/manual/cancel faults are excluded.
    execution_failure_enabled: true
    execution_progress_window: 6.0  # s of valid motion evidence, unaffected by equivalent paths.
    execution_min_progress: 0.05  # m; smaller progress may indicate a blocked chassis.
    execution_heading_progress: 0.15  # rad; normal in-place alignment counts as progress.
    execution_evidence_timeout: 1.0  # s; fresh TF, scan, odom, localization and mux required.
    action_name: /follow_path
    controller_id: FollowPath
    goal_checker_id: general_goal_checker
    # Await the terminal action result, retry cancel, then latch stop if unresolved.
    follow_request_timeout: 5.0
    follow_feedback_timeout: 5.0
    follow_cancel_timeout: 3.0
    follow_cancel_retry_period: 0.5
    # These are upper bounds; Nav2 retains its lower configured speed limits.
    curve_speed_limit_enabled: true
    curve_speed_limit_topic: /speed_limit
    curve_preview_distance: 0.75  # m ahead along the path.
    curve_base_frame: base_footprint
    curve_pose_timeout: 1.0  # s; stale pose keeps the conservative whole-route cap.
    curve_minimum_chord: 0.15  # m; avoids curvature spikes from dense tracking poses.
    curve_alignment_angle: 0.65  # rad; restore Nav2 angular range for in-place alignment.
    curve_goal_heading_distance: 0.30  # m; do not restrict final yaw alignment.
    curve_max_linear_velocity: 0.25  # m/s
    curve_max_angular_velocity: 0.35  # rad/s
    curve_max_lateral_acceleration: 0.10  # m/s^2
/change_memory:
  ros__parameters:
    map_topic: /map
    scan_topic: /scan
    map_frame: map
    base_frame: base_footprint
    occupied_threshold: 65
    # Suppress only returns matching the first mapped wall along that beam.
    mapped_wall_range_tolerance_m: 0.05  # m; closer objects remain live obstacles.
    confirm_observations: 5
    clear_observations: 5
    confirm_min_duration_sec: 2.0
    clear_min_duration_sec: 2.0
    min_observation_interval_sec: 0.25
    save_every_scans: 5
    # Wait briefly for TF at the laser measurement stamp; never use latest TF.
    scan_tf_wait_sec: 0.20
    scan_tf_queue_size: 5
    scan_tf_stamp_tolerance_sec: 0.02
    scan_future_tolerance_sec: 0.15
