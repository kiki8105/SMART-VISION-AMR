scan_to_scan_filter_chain:
  ros__parameters:
    filter1:
      name: weak_speckle
      type: laser_filters/LaserScanSpeckleFilter
      params:
        # Remove one-beam spikes only. Two adjacent beams can represent a real
        # narrow object and remain visible to the change-memory A* layer.
        filter_type: 0
        max_range: 1.0
        max_range_difference: 0.1
        filter_window: 2
