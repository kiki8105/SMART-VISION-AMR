# Physical TurtleBot, ROS_DOMAIN_ID=16. Map: classroom_20261027_cleaned.yaml.
# x/y are robot observation poses in the map frame, metres.
# x/y stay at robot observation positions, not at the wall-mounted markers.
# yaw is the robot base/front heading at the end of navigation. Nav2 reaches
# the observation point and turns to this heading before camera confirmation.
# Home uses the rear camera; Sector 1-3 use the forward camera.
# Planned wall placement: Home left (opposite the central rectangle),
# Sector 1 right, Sector 2 bottom, Sector 3 top of its partitioned room.
# Sector 3 is the free interior of the lower-left partitioned room.
markers:
  - id: 0
    name: 홈
    x: -0.11
    y: -0.79
    yaw: 0.0  # Base faces right; rear camera faces Home on the left wall.
    camera: rear
  - id: 1
    name: Sector 1
    x: 1.6
    y: 0.08
    yaw: 0.0  # Front camera faces the Sector 1 marker on the right wall.
    camera: front
  - id: 2
    name: Sector 2
    x: 1.71
    y: -3.31
    yaw: -1.5707963267948966  # Front camera faces the bottom wall.
    camera: front
  - id: 3
    name: Sector 3
    x: -0.105
    # Observation point is inside the partition, back from the upper wall
    # enough for the forward camera to see the complete marker.
    y: -2.55
    yaw: 1.5707963267948966  # Front camera faces the top wall.
    camera: front
