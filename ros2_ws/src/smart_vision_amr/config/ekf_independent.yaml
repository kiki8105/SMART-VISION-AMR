# Authoritative local EKF. /wheel/odom comes only from wheel joint angles;
# /imu contributes gyro yaw rate only. The filter alone publishes /odom and
# odom->base_footprint. AMCL still owns map->odom.
ekf_independent:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    odom0: /wheel/odom
    # Wheel longitudinal velocity plus the differential-drive zero lateral
    # velocity constraint. Do not fuse wheel yaw/yaw rate as a second gyro.
    odom0_config: [false, false, false, false, false, false,
                   true, true, false, false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    imu0: /imu
    imu0_config: [false, false, false, false, false, false,
                  false, false, false, false, false, true,
                  false, false, false]
    imu0_queue_size: 20
    imu0_remove_gravitational_acceleration: false
