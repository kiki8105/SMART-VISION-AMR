controller_server:
  ros__parameters:
    FollowPath:
      BaseObstacle.scale: 0.04
      GoalAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalDist.scale: 24.0
      ObstacleFootprint.scale: 0.02
      PathAlign.forward_point_distance: 0.1
      PathAlign.scale: 32.0
      PathDist.scale: 32.0
      RotateToGoal.lookahead_time: -1.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      acc_lim_theta: 0.8
      acc_lim_x: 0.2
      acc_lim_y: 0.0
      angular_granularity: 0.025
      critics:
      - RotateToGoal
      - Oscillation
      - BaseObstacle
      - ObstacleFootprint
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist
      debug_trajectory_details: true
      decel_lim_theta: -1.6
      decel_lim_x: -0.4
      decel_lim_y: 0.0
      forward_prune_distance: 0.75
      limit_vel_cmd_in_traj: false
      linear_granularity: 0.05
      max_speed_xy: 0.22
      max_vel_theta: 0.5
      max_vel_x: 0.22
      max_vel_y: 0.0
      min_speed_theta: 0.12
      min_speed_xy: 0.02
      min_vel_x: 0.0
      min_vel_y: 0.0
      plugin: smart_vision_amr_dwb::RouteTrackingDWB
      prune_distance: 0.4
      route_anchor_search_distance: 0.85
      route_horizon_distance: 0.65
      short_circuit_trajectory_evaluation: false
      sim_time: 2.0
      stateful: true
      trans_stopped_velocity: 0.02
      transform_tolerance: 0.2
      turn_entry_linear: 0.15
      turn_full_angular: 0.35
      turn_min_linear: 0.1
      turn_start_angular: 0.08
      vtheta_samples: 40
      vx_samples: 20
      vy_samples: 0
      xy_goal_tolerance: 0.15
      publish_evaluation: true
      publish_trajectories: false
      publish_cost_grid_pc: false
      publish_local_plan: true
      publish_transformed_plan: true
    controller_frequency: 10.0
    controller_plugins:
    - FollowPath
    failure_tolerance: 0.3
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
    goal_checker_plugins:
    - general_goal_checker
    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    progress_checker:
      movement_time_allowance: 20.0
      plugin: nav2_controller::PoseProgressChecker
      required_movement_angle: 0.35
      required_movement_radius: 0.12
    progress_checker_plugin: progress_checker
    use_sim_time: false
    bond_heartbeat_period: 0.0
local_costmap:
  local_costmap:
    ros__parameters:
      always_send_full_costmap: true
      footprint_padding: 0.0
      global_frame: odom
      height: 3
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 0.3
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        enabled: true
        observation_sources: scan
        plugin: nav2_costmap_2d::ObstacleLayer
        scan:
          clearing: true
          data_type: LaserScan
          marking: true
          max_obstacle_height: 2.0
          topic: /scan
      plugins:
      - obstacle_layer
      - voxel_layer
      - inflation_layer
      publish_frequency: 2.0
      resolution: 0.05
      robot_base_frame: base_link
      robot_radius: 0.22
      rolling_window: true
      static_layer:
        map_subscribe_transient_local: true
      update_frequency: 5.0
      use_sim_time: false
      voxel_layer:
        enabled: true
        mark_threshold: 0
        max_obstacle_height: 2.0
        observation_sources: scan
        origin_z: 0.0
        plugin: nav2_costmap_2d::VoxelLayer
        publish_voxel_map: true
        scan:
          clearing: true
          data_type: LaserScan
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          topic: /scan
        z_resolution: 0.05
        z_voxels: 16
      width: 3
  local_costmap_client:
    ros__parameters:
      use_sim_time: false
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: false
