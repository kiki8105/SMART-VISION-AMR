# BENCHMARK CANDIDATE ONLY.
# One factor versus official classroom_hardware_nodes.yaml: A* gain 1.5 -> 2.2.
# Physical braking margin remains the official 0.15 m.
/astar_planner:
  ros__parameters:
    map_topic: /map
    map_frame: map
    base_frame: base_footprint
    occupied_threshold: 65
    obstacle_inflation_cells: 5
    local_detour_enabled: true
    local_detour_trigger_distance: 1.5
    local_detour_max_rejoin_distance: 2.5
    local_detour_max_length: 4.0
    local_detour_max_lateral_distance: 0.9
    local_detour_clearance_margin: 0.0
    local_detour_observation_margin: 0.0
    local_detour_occlusion_extension: 0.2
    local_detour_rejoin_buffer: 0.15
    local_detour_max_expansions: 1500
    local_detour_max_planning_time: 0.06
    local_detour_max_candidates: 10
    local_detour_max_attempts: 3
    mapped_wall_return_tolerance_cells: 2
    robot_radius: 0.22
    start_egress_enabled: true
    start_egress_clearance_margin: 0.0
    start_egress_max_cells: 7
    live_obstacle_layer_required: true
    live_obstacle_timeout: 2.0
    live_route_confirmation_scans: 3
    preferred_clearance: 0.45
    clearance_penalty_gain: 2.2
    reverse_recovery_enabled: true
    reverse_recovery_min_distance: 0.1
    reverse_recovery_max_distance: 0.3
    reverse_recovery_clearance_margin: 0.0
    reverse_recovery_speed: 0.1
    reverse_recovery_max_attempts: 3
    path_smoothing_enabled: true
    path_smoothing_iterations: 2
    path_smoothing_shortcut_distance: 0.8
    path_resample_spacing: 0.05
    failure_memory_enabled: true
    controller_retry_limit: 3
    obstacle_hold_enabled: true
    obstacle_retry_limit: 3
    obstacle_clear_duration: 2.0
    failure_memory_ttl: 120.0
    failure_memory_radius: 0.25
    failure_memory_heading_tolerance: 1.0471975511965976
    failure_memory_max_entries: 64
    failure_memory_penalty: 2.0
    failure_event_max_age: 3.0
    rejoin_progress_distance: 0.35
    rejoin_cross_track_tolerance: 0.2
    recovery_turn_heading_threshold: 0.65
    recovery_turn_clearance_margin: 0.0
/path_follower:
  ros__parameters:
    recovery_robot_radius: 0.22
    recovery_rear_margin: 0.01
    navigation_sensor_continuity_timeout: 1.0
    execution_failure_enabled: true
    execution_progress_window: 6.0
    execution_min_progress: 0.05
    execution_heading_progress: 0.15
    execution_evidence_timeout: 1.0
    action_name: /follow_path
    controller_id: FollowPath
    goal_checker_id: general_goal_checker
    follow_request_timeout: 5.0
    follow_feedback_timeout: 5.0
    follow_cancel_timeout: 3.0
    follow_cancel_retry_period: 0.5
    curve_speed_limit_enabled: true
    curve_linear_limit_preserves_angular_speed: true
    curve_speed_limit_topic: /speed_limit
    curve_preview_distance: 1.0
    curve_base_frame: base_footprint
    curve_pose_timeout: 1.0
    curve_minimum_chord: 0.15
    curve_alignment_angle: 0.45
    curve_goal_heading_distance: 0.3
    curve_max_linear_velocity: 0.22
    curve_min_linear_speed_limit: 0.12
    curve_max_angular_velocity: 0.35
    curve_max_lateral_acceleration: 0.1
    curve_braking_deceleration: 0.1
    curve_braking_margin: 0.15
/change_memory:
  ros__parameters:
    map_topic: /map
    scan_topic: /scan
    map_frame: map
    base_frame: base_footprint
    occupied_threshold: 65
    mapped_wall_range_tolerance_m: 0.05
    live_obstacle_max_range_m: 1.0
    confirm_observations: 5
    clear_observations: 5
    confirm_min_duration_sec: 2.0
    clear_min_duration_sec: 2.0
    min_observation_interval_sec: 0.25
    save_every_scans: 5
    live_obstacle_ttl_sec: 2.0
    live_scan_max_age_sec: 1.0
    live_transform_max_age_sec: 1.0
    scan_tf_wait_sec: 0.35
    scan_tf_queue_size: 5
    scan_tf_stamp_tolerance_sec: 0.02
    scan_future_tolerance_sec: 0.15
